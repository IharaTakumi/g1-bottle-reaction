# Opt-in with --found-audio. No TTS synthesis or robot motion.
# Confidence uses the existing --yolo-confidence option (default 0.25).
found_duration: 0.3
dropout_grace: 0.15
audio_cooldown: 2.0
rearm_absence: 1.0
# Semantic path for the existing person-found WAV; never synthesize.
sound: .cache/tts/person/detected.wav
output: g1
