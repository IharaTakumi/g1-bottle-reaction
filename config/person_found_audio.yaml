# Opt-in with --found-audio. No TTS synthesis or robot motion.
# Confidence uses the existing --yolo-confidence option (default 0.25).
found_duration: 0.3
dropout_grace: 0.15
audio_cooldown: 2.0
rearm_absence: 1.0
# Version-controlled person-found reaction; never synthesize at runtime.
sound: assets/audio/reactions/person/detected.wav
output: g1
